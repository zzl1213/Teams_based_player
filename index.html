<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会议回放 · Transcript Player</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ======= 顶部栏 ======= -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="btnBack" title="返回" aria-label="返回">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="meeting-info">
        <h1 id="meetingTitle">会议回放</h1>
        <div class="meeting-meta">
          <span id="metaDate"></span>
          <span class="dot">·</span>
          <span id="metaDuration"></span>
          <span class="dot">·</span>
          <span id="metaParticipants"></span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-primary" id="btnOpen">打开文件</button>
      <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.484.484 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </header>

  <!-- ======= 主内容：左侧视频 / 右侧 Transcript ======= -->
  <main class="layout">
    <section class="player-area">
      <div class="video-shell" id="videoShell" tabindex="0">
        <video id="video" preload="metadata" playsinline></video>

        <!-- 空状态 / 拖放区 -->
        <div class="video-empty" id="videoEmpty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" width="48" height="48"><path d="M18 3v2h-2V3H8v2H6V3H4v18h16V3h-2zm-5 11.5V17h-2v-2.5L8 12l3-2.5V7h2v2.5L16 12l-3 2.5z" fill="currentColor"/></svg>
          </div>
          <p class="empty-title">拖放视频文件到这里，或点击选择</p>
          <p class="empty-sub">支持 MP4 / WebM / Ogg，另可拖入 JSON / VTT / SRT 逐字稿</p>
          <div class="empty-actions">
            <button class="btn btn-primary" id="btnPickVideo">选择视频</button>
            <button class="btn" id="btnPickTranscript">选择 Transcript</button>
            <button class="btn btn-ghost" id="btnLoadSample">生成示例视频（离线）</button>
          </div>
        </div>

        <!-- 视频播放中覆盖层 -->
        <div class="video-overlay" id="videoOverlay">
          <button class="big-play" id="btnBigPlay" aria-label="播放/暂停">
            <svg viewBox="0 0 24 24" width="64" height="64"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          </button>
          <div class="video-title" id="videoTitleOverlay"></div>
        </div>

        <!-- 加载失败提示 -->
        <div class="video-error" id="videoError" hidden>
          <p>⚠ 视频加载失败</p>
          <p class="sub">请检查网络，或选择本地视频文件播放。</p>
          <div class="empty-actions">
            <button class="btn btn-primary" id="btnRetryVideo">选择本地视频</button>
            <button class="btn" id="btnGenError">生成示例视频（离线）</button>
          </div>
        </div>

        <!-- 自定义控制条 -->
        <div class="controls" id="controls">
          <div class="controls-progress">
            <span class="time" id="timeCurrent">00:00</span>
            <div class="progress" id="progress" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
              <div class="progress-buffered" id="progressBuffered"></div>
              <div class="progress-played" id="progressPlayed"></div>
              <div class="progress-thumb" id="progressThumb"></div>
            </div>
            <span class="time" id="timeTotal">00:00</span>
          </div>
          <div class="controls-buttons">
            <button class="ctrl-btn" id="btnPlay" title="播放/暂停 (空格)" aria-label="播放/暂停">
              <svg class="ico-play" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
              <svg class="ico-pause" viewBox="0 0 24 24" width="20" height="20" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/></svg>
            </button>
            <button class="ctrl-btn" id="btnBack10" title="后退 10 秒" aria-label="后退 10 秒">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
            </button>
            <button class="ctrl-btn" id="btnFwd10" title="前进 10 秒" aria-label="前进 10 秒">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z" fill="currentColor"/></svg>
            </button>

            <div class="volume-wrap">
              <button class="ctrl-btn" id="btnMute" title="静音 (M)" aria-label="静音">
                <svg class="ico-vol" viewBox="0 0 24 24" width="20" height="20"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>
              </button>
              <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="1" aria-label="音量" />
            </div>

            <span class="ctrl-spacer"></span>

            <div class="speed-wrap">
              <button class="ctrl-btn speed-btn" id="btnSpeed" title="播放速度">1x</button>
              <div class="speed-menu" id="speedMenu" hidden>
                <button data-rate="0.5">0.5x</button>
                <button data-rate="0.75">0.75x</button>
                <button data-rate="1" class="active">正常</button>
                <button data-rate="1.25">1.25x</button>
                <button data-rate="1.5">1.5x</button>
                <button data-rate="1.75">1.75x</button>
                <button data-rate="2">2x</button>
              </div>
            </div>

            <button class="ctrl-btn" id="btnPip" title="画中画" aria-label="画中画">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 7h-8v6h8V7zm2-4H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18v14z" fill="currentColor"/></svg>
            </button>
            <button class="ctrl-btn" id="btnFullscreen" title="全屏 (F)" aria-label="全屏">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 章节条 -->
      <div class="chapters-bar" id="chaptersBar" hidden>
        <span class="chapters-label">章节</span>
        <div class="chapters-row" id="chaptersRow"></div>
      </div>
    </section>

    <!-- ======= 右侧 Transcript 面板 ======= -->
    <aside class="transcript-panel" id="transcriptPanel">
      <div class="t-header">
        <h2>Transcript</h2>
        <div class="t-tools">
          <button class="t-tool" id="btnScrollLock" title="自动跟随播放滚动">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12h10v2H4zm0-5h16v2H4zm0 10h10v2H4zM18 13.5V17h-3.5v2H18v3.5h2V19h3.5v-2H20v-3.5h-2z" fill="currentColor"/></svg>
          </button>
          <button class="t-tool" id="btnFontDec" title="减小字号">A−</button>
          <button class="t-tool" id="btnFontInc" title="增大字号">A+</button>
          <button class="t-tool" id="btnCopy" title="复制 Transcript">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div class="t-search">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" fill="currentColor"/></svg>
        <input type="text" id="searchInput" placeholder="搜索 Transcript" autocomplete="off" />
        <div class="search-extra">
          <span class="search-count" id="searchCount" hidden></span>
          <button class="search-nav" id="searchPrev" title="上一个匹配" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/></svg>
          </button>
          <button class="search-nav" id="searchNext" title="下一个匹配" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="m10 6-1.41 1.41L13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor"/></svg>
          </button>
          <button class="search-clear" id="searchClear" title="清除搜索" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div class="t-list" id="transcriptList"></div>

      <div class="t-footer" id="transcriptFooter"></div>
    </aside>
  </main>

  <!-- ======= 设置弹窗 ======= -->
  <div class="modal-mask" id="settingsModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>设置</h3>
        <button class="icon-btn" id="btnCloseSettings" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>视频地址</span>
          <input type="text" id="cfgVideoUrl" placeholder="https://... 或留空" />
          <button class="btn btn-primary btn-sm" id="btnApplyVideo">应用</button>
        </label>
        <div class="field">
          <span>导入数据</span>
          <div class="field-row">
            <button class="btn btn-sm" id="cfgPickVideo">视频文件</button>
            <button class="btn btn-sm" id="cfgPickTranscript">Transcript 文件</button>
                        <button class="btn btn-sm btn-ghost" id="cfgGenSample">生成示例视频</button>
            <button class="btn btn-sm btn-ghost" id="cfgRestoreImport">恢复上次导入</button>
            <button class="btn btn-sm btn-ghost" id="cfgLoadSample">恢复示例数据</button>
          </div>
        </div>
        <label class="switch-row">
          <span>Transcript 自动跟随播放滚动</span>
          <input type="checkbox" id="cfgAutoScroll" checked />
          <i class="switch"></i>
        </label>
        <label class="switch-row">
          <span>深色主题</span>
          <input type="checkbox" id="cfgDarkTheme" />
          <i class="switch"></i>
        </label>
      </div>
    </div>
  </div>

  <!-- ======= Toast ======= -->
  <div class="toast" id="toast" hidden></div>

  <input type="file" id="fileVideo" accept="video/*,.mkv" hidden />
  <input type="file" id="fileTranscript" accept=".json,.vtt,.srt,.txt" hidden />

  <script src="data/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
